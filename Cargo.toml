[package]
name = "spa-nails"
version = "0.1.0"
edition = "2024"

[dependencies]
ironforge = { version = "0.1.2", path = "/media/don-barrigon/steam-ssd/projects/ironforge/core" }
ironforge-macros = { version = "0.1.2", path = "/media/don-barrigon/steam-ssd/projects/ironforge/macros" }

# ================ maps ================
ahash = { version = "0.8", features = ["serde"] }

# ================ seriaalizacion ================
rmp-serde = "1.3.1"

# ================ hyper ================
hyper = { version = "1", features = ["full"] }
tokio = { version = "1", features = ["full"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
bytes = "1.12.1"

# ================ tls ================
rcgen        = "0.13"
rustls = { version = "0.23"}
tokio-rustls = "0.26"
rustls-pemfile = "2"

# ================ fechas ================
chrono = { version = "0.4", features = ["serde"] }
time = "0.3.55"

# ================ error ================
backtrace = "0.3"

# =============== serde ================
serde = "1.0.188"
serde_json = "1.0.149"
serde_urlencoded = "0.7.1"
serde_yaml = "0.9.34"

# =============== hash ================
argon2 = "0.6.0"

# ================ mongodb ================
futures = "0.3.28"

# ##tokio = {version = "1.32.0", features = ["full"]}

# ================ otras ================
regex = "1.13.1"

[dependencies.mongodb]
version = "3.8.2"
