{#- Documento HTML de todas las páginas. Cada módulo agrega su CSS y su JS
    en los bloques `styles` y `scripts`. -#}
<!doctype html>
<html lang="es"{% if !shell.theme().is_empty() %} data-theme="{{ shell.theme() }}"{% endif %}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ shell.csrf }}">
  <title>{{ shell.title }} · {{ shell.app_name() }}</title>
  <link rel="stylesheet" href="/resources/css/main.css">
  {%- block styles %}{% endblock %}
  <script defer src="/resources/js/app.js"></script>
  {%- block scripts %}{% endblock %}
</head>
<body>
{% block body %}{% endblock %}
<div class="snack-bar" data-snack-bar role="status" aria-live="polite"></div>
</body>
</html>
